global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "twitch_bot_api"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: "twitch_bot_api"

  - job_name: "twitch_bot_web"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["web:8001"]
        labels:
          service: "twitch_bot_web"
