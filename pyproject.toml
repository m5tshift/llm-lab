[project]
name = "twitch-multimodal-bot"
version = "0.1.0"
description = "Multimodal Twitch stream analysis with local ML models and LLM"
requires-python = ">=3.11,<3.15"
dependencies = [
    "accelerate>=0.27.0",
    "av>=12.0.0",
    "fastapi>=0.110.0",
    "gradio>=4.20.0",
    "huggingface-hub",
    "librosa>=0.10.0",
    "numpy>=1.24.0",
    "opencv-python>=4.8.0",
    "pillow>=10.0.0",
    "prometheus-client>=0.20.0",
    "psutil>=5.9.0",
    "pydantic>=2.0.0",
    "python-multipart>=0.0.9",
    "qwen-vl-utils>=0.0.8",
    "requests>=2.31.0",
    "soundfile>=0.12.0",
    "streamlink>=6.0.0",
    "torch",
    "torchvision",
    "transformers>=4.38.0",
    "ultralytics>=8.1.0",
    "uvicorn>=0.28.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pre-commit>=4.6.0",
    "pytest>=8.0.0",
    "ruff>=0.11.0",
]

report = [
    "reportlab>=4.0",
    "pymupdf>=1.24",
    "pillow>=10.0",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100
include = ["*.py", "*.pyi"]
extend-exclude = ["output"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
