minimum_pre_commit_version: '4.6.0'
default_stages: [pre-commit]
exclude: '^(output|tmp|models|bin|venv|\.venv)/'

repos:
  - repo: local
    hooks:
      # Use the same Ruff version and settings as Makefile and CI.
      - id: ruff-check
        name: Ruff lint
        entry: uv run --locked ruff check --fix
        language: system
        types_or: [python, pyi]
        files: '^(src|tests|scripts)/'
      - id: ruff-format
        name: Ruff format
        entry: uv run --locked ruff format
        language: system
        types_or: [python, pyi]
        files: '^(src|tests|scripts)/'

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
